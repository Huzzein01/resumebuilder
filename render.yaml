services:
  - type: web
    name: resumebuilder-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=backend
    startCommand: node backend/dist/index.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
